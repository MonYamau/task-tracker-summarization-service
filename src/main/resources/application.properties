spring.application.name=task-tracker-summarization-service
spring.config.import=file:./.env[.properties]


spring.cloud.openfeign.client.config.openAiClient.default-request-headers.Authorization=Api-Key ${llm.api-key}
spring.cloud.openfeign.client.config.openAiClient.default-request-headers.OpenAI-Project=${llm.folder-id}

llm.url=https://ai.api.cloud.yandex.net
llm.endpoint=/v1/chat/completions

llm.folder-id=${FOLDER_ID}
llm.api-key=${API_KEY}
llm.model=gpt://${llm.folder-id}/yandexgpt-5-lite