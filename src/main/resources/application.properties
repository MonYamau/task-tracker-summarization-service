spring.application.name=task-tracker-summarization-service
spring.profiles.active=local
spring.config.import=file:./.env[.properties]

spring.kafka.consumer.group-id=report_summarizer_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.monyamau.task_tracker_summarization_service.dto.request.PersonalTaskCollectionRequestDto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=120000

kafka.topics.request=TASK_REPORT_REQUESTS
kafka.topics.response=TASK_REPORT_RESPONSES
kafka.topics.dlt-request=TASK_REPORT_REQUESTS_DLT

spring.cloud.openfeign.client.config.openAiClient.connect-timeout=6000
spring.cloud.openfeign.client.config.openAiClient.read-timeout=120000
spring.cloud.openfeign.client.config.openAiClient.default-request-headers.Authorization=${API_KEY}
spring.cloud.openfeign.client.config.openAiClient.default-request-headers.OpenAI-Project=${FOLDER_ID}

llm.url=https://ai.api.cloud.yandex.net
llm.endpoint=/v1/chat/completions
llm.model=${LLM_MODEL}