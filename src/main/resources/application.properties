spring.application.name=task-tracker-summarization-service
spring.profiles.active=local
spring.config.import=file:./.env[.properties]

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.monyamau.task_tracker_summarization_service.dto.request.PersonalTaskCollectionRequestDto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.group-id=report_summarizer_group

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

kafka.topics.request=TASK_REPORT_REQUESTS
kafka.topics.response=TASK_REPORT_RESPONSES

spring.cloud.openfeign.client.config.openAiClient.default-request-headers.Authorization=Api-Key ${llm.api-key}
spring.cloud.openfeign.client.config.openAiClient.default-request-headers.OpenAI-Project=${llm.folder-id}
spring.cloud.openfeign.client.config.openAiCLient.connect-timeout=6000
spring.cloud.openfeign.client.config.openAiClient.read-timeout=120000

llm.url=https://ai.api.cloud.yandex.net
llm.endpoint=/v1/chat/completions

llm.folder-id=${FOLDER_ID}
llm.api-key=${API_KEY}
llm.model=gpt://${llm.folder-id}/yandexgpt-5-lite